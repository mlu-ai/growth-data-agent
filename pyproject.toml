[project]
name = "growth-data-agent"
version = "0.1.0"
description = "Evidence-first governed analytics service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-postgres>=3,<4",
  "llama-index-core>=0.12,<0.15",
  "llama-index-vector-stores-qdrant>=0.6,<0.9",
  "metricflow>=0.212,<1",
  "mlflow>=2.17,<3",
  "pydantic>=2.9,<3",
  "psycopg[binary]>=3.2,<4",
  "qdrant-client>=1.12,<2",
  "uvicorn>=0.30,<1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/growth_data_agent"]

[dependency-groups]
dev = ["httpx2>=2,<3", "pytest>=8.3,<9", "ruff>=0.8,<1"]
warehouse = ["dbt-postgres>=1.9,<2"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

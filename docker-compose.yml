services:
  postgres:
    image: apache/age:release_PG16_1.6.0
    environment:
      POSTGRES_DB: growth_data
      POSTGRES_USER: growth_data
      POSTGRES_PASSWORD: growth_data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U growth_data -d growth_data"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:

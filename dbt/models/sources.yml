version: 2

sources:
  - name: synthetic
    schema: public
    tables:
      - name: tenants
        description: Synthetic Tenants, including the governed billing Region.
        columns:
          - name: tenant_id
            tests: [not_null, unique]
      - name: paid_enablements
        description: Immutable Paid Enablement events for synthetic Product Users.
        columns:
          - name: paid_enablement_id
            tests: [not_null, unique]
          - name: product_user_id
            tests: [not_null]
          - name: product
            tests:
              - accepted_values:
                  arguments:
                    values: [Jira, Confluence]
      - name: visits
        description: Visit events for synthetic Product Users.
        columns:
          - name: visit_id
            tests: [not_null, unique]
          - name: product_user_id
            tests: [not_null]
          - name: product
            tests:
              - accepted_values:
                  arguments:
                    values: [Jira, Confluence]
      - name: product_user_entitlements
        description: >
          Provisioning/entitlement events for synthetic Product Users, distinct
          from and logically prior to Paid Enablement (paid access).
        columns:
          - name: entitlement_id
            tests: [not_null, unique]
          - name: product_user_id
            tests: [not_null]
          - name: product
            tests:
              - accepted_values:
                  arguments:
                    values: [Jira, Confluence]

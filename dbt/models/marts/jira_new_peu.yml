version: 2

models:
  - name: fct_jira_new_peu
    description: One row for the first Jira Paid Enablement of each Product User.
    columns:
      - name: product_user_id
        tests: [not_null, unique]
      - name: tenant_id
        tests: [not_null]
      - name: paid_enabled_at
        tests: [not_null]

semantic_models:
  - name: jira_new_peu
    description: Canonical Jira New Paid Enabled User semantic model.
    model: ref('fct_jira_new_peu')
    config:
      meta:
        semantic_version: "1.0.0"
        canonical_grain: Product User in a Tenant and Jira product
        canonical_time_rule: Attribute to the first-ever Jira Paid Enablement; later restorations do not qualify again.
    defaults:
      agg_time_dimension: paid_enablement_date
    entities:
      - name: product_user
        type: primary
        expr: product_user_id
    dimensions:
      - name: paid_enablement_date
        type: time
        type_params:
          time_granularity: day
    measures:
      - name: jira_new_peu
        description: Count of Product Users with their first-ever Jira Paid Enablement.
        agg: count_distinct
        expr: product_user_id

metrics:
  - name: jira_new_peu
    description: Jira New PEU is a Product User's first-ever Paid Enablement for Jira.
    type: simple
    type_params:
      measure: jira_new_peu
